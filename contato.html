                                <label for="mensagem"><b>Mensagem:</b></label><br>
                                <textarea id="mensagem" name="mensagem" rows="5" required
                                    style="width:95%; padding:10px; margin:8px 0; border:none; border-radius:8px;"></textarea><br>

                                <button type="submit"
                                    style="background:linear-gradient(90deg, #a13afc, #5ec0ff); color:white;
                                    border:none; padding:12px 28px; border-radius:12px; font-size:16px;
                                    cursor:pointer; font-family:'Trebuchet MS';">
